[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-adaptation-capture"
version = "0.1.0"
description = "Bounded SGLang Golden Sample capture for the Step-3.7 P800 Demo"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."sglang.srt.plugins"]
model_adaptation_capture = "model_adaptation_capture.plugin:register"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["model_adaptation_capture*"]
